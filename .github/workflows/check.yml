name: Check frontend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/app.js
      - run: node --check site/live-adapter.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt -e robot_contracts
      - run: PYTHONPATH=backend:robot_contracts pytest backend/tests gateway/tests robot_contracts/tests -q
