# Robot Cloud Platform 本地一键启动
# 依赖：Docker Compose v2
# 启动：docker compose -f docker/docker-compose.yml up --build
services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: robot-mqtt
    ports:
      - "1884:1884"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1884", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 3s
      timeout: 4s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: robot-backend
    environment:
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: "1884"
      ZMQ_PUB_PORT: "5555"
      MQTT_TOPIC_PREFIX: robots
      ROBOT_MODE: "${ROBOT_MODE:-simulation}"
    ports:
      - "8000:8000"
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped

  # 模拟机器人消息（无需真实 ROS2 环境，向 MQTT 发测试数据）
  simulator:
    profiles: ["demo"]
    image: python:3.11-slim
    container_name: robot-sim
    working_dir: /app
    volumes:
      - ../gateway:/app
      - ../robot_contracts:/robot_contracts:ro
    environment:
      PYTHONPATH: /robot_contracts
    command: >
      bash -c "pip install paho-mqtt && python3 mqtt_simulator.py --mqtt-broker mqtt-broker --mqtt-port 1884 --mode simulation"
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped

  # Mock 机器人（订阅 command 下行指令，验证云端→机器人链路）
  mock-robot:
    profiles: ["demo"]
    image: python:3.11-slim
    container_name: robot-mock
    working_dir: /app
    volumes:
      - ../gateway:/app
      - ../robot_contracts:/robot_contracts:ro
    environment:
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: "1884"
      PYTHONPATH: /robot_contracts
    command: >
      bash -c "pip install paho-mqtt && python3 mock_robot.py --mqtt-broker mqtt-broker --mqtt-port 1884"
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped

  # 与宿主机 ros2_car 联调：使用 host network 发现 ROS2 DDS，并连接宿主机映射的 MQTT。
  gateway-real:
    profiles: ["docker-gateway"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      PYTHONPATH: /opt/robot_contracts
    volumes:
      # 本地联调始终使用工作区最新 Gateway/协议代码，避免旧镜像缓存造成版本不一致。
      - ../gateway:/opt/gateway:ro
      - ../robot_contracts:/opt/robot_contracts:ro
    command: ["--robot-id", "${ROBOT_ID:-car01}", "--robot-namespace", "${ROBOT_NAMESPACE:-}", "--mqtt-broker", "localhost", "--mqtt-port", "1884"]
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped

