<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Cloud Platform · Web Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🤖 Robot Cloud Platform</h1>
    <div class="conn" id="conn-status">连接中…</div>
  </header>

  <main class="grid">
    <!-- 实时状态卡片 -->
    <section class="card" id="status-card">
      <h2>实时状态</h2>
      <div class="stats">
        <div class="stat">
          <span class="label">速度</span>
          <span class="value" id="speed">--</span><span class="unit">m/s</span>
        </div>
        <div class="stat">
          <span class="label">行为</span>
          <span class="value" id="action">--</span>
        </div>
        <div class="stat">
          <span class="label">前方距离</span>
          <span class="value" id="front-distance">--</span><span class="unit">m</span>
        </div>
        <div class="stat">
          <span class="label">障碍物</span>
          <span class="value" id="obstacle-count">--</span>
        </div>
      </div>
      <div class="speed-bar">
        <div class="speed-fill" id="speed-fill"></div>
      </div>
    </section>

    <!-- 远程控制 -->
    <section class="card" id="control-card">
      <h2>远程控制</h2>
      <div class="controls">
        <div class="control-group">
          <label>控制算法</label>
          <select id="algo-select">
            <option value="0">PID</option>
            <option value="1">Bang-Bang</option>
            <option value="2">Ramp</option>
          </select>
          <button onclick="sendAlgo()">切换</button>
        </div>
        <div class="control-group">
          <button onclick="togglePause()" id="pause-btn">暂停仿真</button>
          <button onclick="clearTrail()">清除轨迹</button>
        </div>
      </div>
    </section>

    <!-- 消息监控 -->
    <section class="card" id="message-card">
      <h2>消息监控 <small>(最近 20 条)</small></h2>
      <ul class="log" id="log"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
