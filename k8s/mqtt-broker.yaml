# MQTT Broker（Eclipse Mosquitto）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  namespace: robot-cloud
  labels:
    app: mqtt-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-broker
  template:
    metadata:
      labels:
        app: mqtt-broker
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1883
              name: mqtt
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  namespace: robot-cloud
spec:
  selector:
    app: mqtt-broker
  ports:
    - port: 1883
      targetPort: mqtt
      name: mqtt
  type: ClusterIP
