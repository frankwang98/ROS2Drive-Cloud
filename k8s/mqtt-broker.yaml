# MQTT Broker（Eclipse Mosquitto）
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-broker-config
  namespace: robot-cloud
data:
  mosquitto.conf: |
    # 使用自定义端口 1884（项目统一使用 1884 作为 MQTT 端口）
    listener 1884
    allow_anonymous true
    persistence false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  namespace: robot-cloud
  labels:
    app: mqtt-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-broker
  template:
    metadata:
      labels:
        app: mqtt-broker
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1884
              name: mqtt
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: mosquitto-config
          configMap:
            name: mqtt-broker-config
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  namespace: robot-cloud
spec:
  selector:
    app: mqtt-broker
  ports:
    - port: 1884
      targetPort: mqtt
      name: mqtt
  type: ClusterIP
