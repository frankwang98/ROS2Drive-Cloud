# 后端自动扩缩容（云原生弹性）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: robot-backend-hpa
  namespace: robot-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: robot-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
