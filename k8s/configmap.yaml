# 全局配置（ConfigMap）
apiVersion: v1
kind: ConfigMap
metadata:
  name: robot-backend-config
  namespace: robot-cloud
data:
  MQTT_BROKER: "mqtt-broker"
  MQTT_PORT: "1884"
  MQTT_TOPIC_PREFIX: "robots"
  ZMQ_PUB_PORT: "5555"
  APP_NAME: "Robot Cloud Platform"
  DEBUG: "false"
  ROBOT_MODE: "simulation"
