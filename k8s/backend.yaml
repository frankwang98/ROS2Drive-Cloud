# 后端 Deployment（FastAPI）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-backend
  namespace: robot-cloud
  labels:
    app: robot-backend
spec:
  # Backend 当前使用进程内状态；完成 Redis 共享状态前必须保持单副本。
  replicas: 1
  selector:
    matchLabels:
      app: robot-backend
  template:
    metadata:
      labels:
        app: robot-backend
    spec:
      containers:
        - name: backend
          image: cnb.cool/frankwang98/robot_platform:backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: robot-backend-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: robot-backend
  namespace: robot-cloud
spec:
  selector:
    app: robot-backend
  ports:
    - port: 8000
      targetPort: http
      name: http
  type: ClusterIP
